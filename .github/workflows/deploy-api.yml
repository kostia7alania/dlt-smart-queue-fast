name: Deploy API

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-api
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.GCP_PROJECT_ID != '' &&
      vars.GCP_REGION != '' &&
      vars.GCP_ARTIFACT_REPOSITORY != '' &&
      vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
      vars.GCP_SERVICE_ACCOUNT != '' &&
      vars.CORS_ALLOWED_ORIGINS != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build immutable API image
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/dlt-api:${{ github.sha }}
        run: gcloud builds submit apps/api --project "${{ vars.GCP_PROJECT_ID }}" --tag "${IMAGE}"
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: dlt-smart-queue-api
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/dlt-api:${{ github.sha }}
          env_vars: |-
            DATABASE_REQUIRED=true
            DB_MAX_CONNS=5
            DLT_MAX_CONCURRENCY=4
            CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}
          secrets: |-
            DATABASE_URL=DATABASE_URL:latest
            DLT_WORKFILTER_TOKEN=DLT_WORKFILTER_TOKEN:latest
          flags: >-
            --allow-unauthenticated
            --cpu=1
            --memory=256Mi
            --concurrency=20
            --min-instances=0
            --max-instances=2
            --timeout=30s
      - name: Verify liveness and readiness
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl --fail --show-error --silent "${URL}/healthz"
          curl --fail --show-error --silent "${URL}/readyz"
